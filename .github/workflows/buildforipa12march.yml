# It seems that after the 12th of March the Liquid Glass update was added into the Intergration branch. The problme is that ever since automated builds have broken (outdated XCode?)

name: Build VoidLink IPA from 2026-04-12

permissions:
  contents: read

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build VoidLink IPA (Artifact)
    runs-on: macos-latest

    steps:
      - name: Clone specific commit
        run: |
          git clone https://github.com/The-Fried-Fish/VoidLink-previously-moonlight-zwm.git external-voidlink
          cd external-voidlink
          git checkout e742466409d4c5d94df0e96a155a6d54cf9b1f10
          git submodule update --init --recursive

      - name: Set build tag
        run: echo "TAG_NAME=build-$(date +'%y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Show schemes (debug safety)
        working-directory: external-voidlink
        run: xcodebuild -list -project VoidLink.xcodeproj

      # Optional: only keep if OpenSSL breaks your build
      - name: Patch OpenSSL (if needed)
        working-directory: external-voidlink
        run: |
          find libs/OpenSSL.xcframework -name crypto.h | while read f; do
            if ! grep -q 'sys/time.h' "$f"; then
              echo '#include <sys/time.h>' | cat - "$f" > temp && mv temp "$f"
            fi
          done

      - name: Clean build folder
        working-directory: external-voidlink
        run: rm -rf build DerivedData

      - name: Archive (Release, deterministic path)
        working-directory: external-voidlink
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/VoidLink.xcarchive \
            -derivedDataPath $PWD/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Create IPA (manual, stable fallback)
        working-directory: external-voidlink
        run: |
          APP_PATH=$(find build/VoidLink.xcarchive -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::App not found in archive"
            exit 1
          fi
          mkdir -p build/IPA/Payload
          cp -r "$APP_PATH" build/IPA/Payload/VoidLink.app
          cd build/IPA
          zip -r ../VoidLink.ipa Payload
          cd ../..

      - name: Verify IPA
        working-directory: external-voidlink
        run: |
          if [ ! -f build/VoidLink.ipa ]; then
            echo "::error::VoidLink.ipa not found!"
            exit 1
          fi
          echo "IPA built successfully"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-${{ env.TAG_NAME }}
          path: external-voidlink/build/VoidLink.ipa
          retention-days: 7
