name: Build VoidLink IPA

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 🔁 Init submodules
        if: github.event_name == 'push'
        run: git submodule update --init --recursive

      - name: 🧰 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: 🔍 Show Xcode version
        run: xcodebuild -version

      - name: 📦 Find project
        id: project
        run: |
          if ls *.xcworkspace 1> /dev/null 2>&1; then
            echo "type=workspace" >> $GITHUB_OUTPUT
            echo "file=$(ls *.xcworkspace | head -n 1)" >> $GITHUB_OUTPUT
          elif ls *.xcodeproj 1> /dev/null 2>&1; then
            echo "type=project" >> $GITHUB_OUTPUT
            echo "file=$(ls *.xcodeproj | head -n 1)" >> $GITHUB_OUTPUT
          else
            echo "type=project" >> $GITHUB_OUTPUT
            echo "file=$(find . -name '*.xcodeproj' -type d | head -n 1)" >> $GITHUB_OUTPUT
          fi
          echo "Found: ${{ steps.project.outputs.type }} - ${{ steps.project.outputs.file }}"

      - name: 🔍 List schemes
        run: |
          PROJECT_FILE="${{ steps.project.outputs.file }}"
          if [ -z "$PROJECT_FILE" ]; then
            echo "No project found"
            exit 1
          fi
          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            xcodebuild -workspace "$PROJECT_FILE" -list
          else
            xcodebuild -project "$PROJECT_FILE" -list
          fi

      - name: ⚙ Set scheme
        run: echo "SCHEME=Moonlight" >> $GITHUB_ENV

      - name: 🏗 Build archive
        run: |
          PROJECT_FILE="${{ steps.project.outputs.file }}"
          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            xcodebuild \
              -workspace "$PROJECT_FILE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            xcodebuild \
              -project "$PROJECT_FILE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      - name: 📄 Create ExportOptions.plist
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF

      - name: 📦 Export IPA
        run: |
          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-IPA
          path: build/export/*.ipa




