name: Xcode - Build IPA
on:
  push:
    branches: [ "noWaterMark" ]
  pull_request:
    branches: [ "noWaterMark" ]
  workflow_dispatch:
jobs:
  build:
    name: Build IPA
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Checkout submodules
        run: git submodule update --init --recursive
      - name: Fetch upstream project and all VoidLink files
        run: |
          curl -L -o /tmp/voidlink.tar.gz \
            "https://github.com/The-Fried-Fish/VoidLink-previously-moonlight-zwm/archive/refs/heads/noWaterMark.tar.gz"
          tar -xzf /tmp/voidlink.tar.gz -C /tmp/
          cp -r /tmp/VoidLink-previously-moonlight-zwm-noWaterMark/Moonlight.xcodeproj .
          
          # Create missing directories first
          mkdir -p Limelight/Input Limelight/ViewControllers Limelight/Localization
          
          # Copy Swift files from upstream
          cp /tmp/VoidLink-previously-moonlight-zwm-noWaterMark/Limelight/Input/CommandManager.swift Limelight/Input/
          cp /tmp/VoidLink-previously-moonlight-zwm-noWaterMark/Limelight/Input/OnScreenWidgetView.swift Limelight/Input/
          cp /tmp/VoidLink-previously-moonlight-zwm-noWaterMark/Limelight/ViewControllers/CommandManagerViewController.swift Limelight/ViewControllers/
          cp /tmp/VoidLink-previously-moonlight-zwm-noWaterMark/Limelight/Localization/SwiftLocalizationHelper.swift Limelight/Localization/
          cp /tmp/VoidLink-previously-moonlight-zwm-noWaterMark/Limelight/OrientationHelper.swift Limelight/
          cp /tmp/VoidLink-previously-moonlight-zwm-noWaterMark/Limelight/Moonlight-Bridging-Header.h Limelight/
          
          rm -rf /tmp/voidlink.tar.gz /tmp/VoidLink-previously-moonlight-zwm-noWaterMark
      - name: Debug - List Swift files
        run: |
          echo "=== Swift files in Limelight/ ==="
          ls -la Limelight/*.swift 2>/dev/null || echo "None in root"
          echo "=== Swift files in Limelight/Input/ ==="
          ls -la Limelight/Input/*.swift 2>/dev/null || echo "None in Input"
          echo "=== Swift files in Limelight/ViewControllers/ ==="
          ls -la Limelight/ViewControllers/*.swift 2>/dev/null || echo "None in ViewControllers"
          echo "=== Swift files in Limelight/Localization/ ==="
          ls -la Limelight/Localization/*.swift 2>/dev/null || echo "None in Localization"
