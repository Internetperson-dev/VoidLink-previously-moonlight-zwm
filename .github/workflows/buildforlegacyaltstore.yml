name: Build VoidLink IPA (AltStore)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔁 Init submodules
        run: git submodule update --init --recursive

      - name: 🧰 Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: 🔍 Show Xcode version
        run: xcodebuild -version

      # 🧠 Detect project automatically (this repo doesn't use CocoaPods by default)
      - name: 📦 Find project
        id: project
        run: |
          if ls *.xcworkspace 1> /dev/null 2>&1; then
            echo "type=workspace" >> $GITHUB_OUTPUT
            echo "file=$(ls *.xcworkspace | head -n 1)" >> $GITHUB_OUTPUT
          else
            echo "type=project" >> $GITHUB_OUTPUT
            echo "file=$(ls *.xcodeproj | head -n 1)" >> $GITHUB_OUTPUT
          fi

      - name: 🔍 List schemes
        run: |
          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            xcodebuild -workspace "${{ steps.project.outputs.file }}" -list
          else
            xcodebuild -project "${{ steps.project.outputs.file }}" -list
          fi

      # ⚠️ IMPORTANT: You MUST SET THIS after first run
      - name: ⚙️ Set scheme (EDIT THIS)
        run: |
          echo "SCHEME=Moonlight" >> $GITHUB_ENV

      # 🏗️ Build archive (real device)
      - name: 🏗️ Build archive
        run: |
          if [ "${{ steps.project.outputs.type }}" = "workspace" ]; then
            xcodebuild \
              -workspace "${{ steps.project.outputs.file }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          else
            xcodebuild \
              -project "${{ steps.project.outputs.file }}" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -archivePath build/App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
          fi

      # 📄 Create ExportOptions.plist dynamically
      - name: 📄 Create ExportOptions.plist
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>destination</key>
              <string>export</string>
          </dict>
          </plist>
          EOF

      # 📦 Export IPA
      - name: 📦 Export IPA
        run: |
          mkdir -p build/export
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist \
            CODE_SIGNING_ALLOWED=NO

      # 📤 Upload artifact
      - name: 📤 Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-IPA
          path: build/export/*.ipa
