name: Build VoidLink IPA

on:
  push:
    branches: [ "Integration" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo (with submodules)
        uses: actions/checkout@v4
        with:
          repository: The-Fried-Fish/VoidLink-previously-moonlight-zwm
          ref: Integration
          submodules: recursive

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -list -project VoidLink.xcodeproj

      # Optional patch (keep if you actually hit OpenSSL errors)
      - name: Patch OpenSSL headers
        run: |
          find libs/OpenSSL.xcframework -name crypto.h | while read f; do
            if ! grep -q 'sys/time.h' "$f"; then
              echo '#include <sys/time.h>' | cat - "$f" > temp && mv temp "$f"
            fi
          done

      - name: Archive app (unsigned)
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/VoidLink.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA
        run: |
          mkdir -p build/export
          cat > build/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/VoidLink.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/exportOptions.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink.ipa
          path: build/export/*.ipa
