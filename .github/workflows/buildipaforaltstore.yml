name: Build VoidLink IPA

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:
      - name: Clone upstream (with submodules)
        run: |
          git clone --recursive --branch Integration \
          https://github.com/The-Fried-Fish/VoidLink-previously-moonlight-zwm.git external-voidlink

      - name: Set build tag
        run: |
          echo "TAG_NAME=build-$(date +'%y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Select newest available Xcode
        run: |
          echo "Available Xcode installations:"
          ls -d /Applications/Xcode*.app || true

          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)

          echo "Selected Xcode: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"

          xcodebuild -version

      - name: List schemes (debug safety)
        working-directory: external-voidlink
        run: xcodebuild -list -project VoidLink.xcodeproj

      # Optional: keep your OpenSSL fix if needed
      - name: Patch OpenSSL (if required)
        working-directory: external-voidlink
        run: |
          find libs/OpenSSL.xcframework -name crypto.h | while read f; do
            if ! grep -q 'sys/time.h' "$f"; then
              echo '#include <sys/time.h>' | cat - "$f" > temp && mv temp "$f"
            fi
          done

      - name: Archive app
        working-directory: external-voidlink
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/VoidLink.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Export IPA
        working-directory: external-voidlink
        run: |
          mkdir -p build/export

          cat > build/exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
          "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/VoidLink.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/exportOptions.plist \
            CODE_SIGNING_ALLOWED=NO

      - name: Verify IPA
        run: |
          if ! ls external-voidlink/build/export/*.ipa 1> /dev/null 2>&1; then
            echo "::error::IPA not generated"
            exit 1
          fi

      - name: Release IPA
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: ${{ env.TAG_NAME }}
          prerelease: false
          files: external-voidlink/build/export/*.ipa
