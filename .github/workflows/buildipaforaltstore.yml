name: Build VoidLink IPA

permissions:
  contents: write

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: macos-latest

    steps:
      - name: Clone upstream (with submodules)
        run: |
          git clone --recursive --branch Integration \
          https://github.com/The-Fried-Fish/VoidLink-previously-moonlight-zwm.git external-voidlink

      - name: Set build tag
        run: |
          echo "TAG_NAME=build-$(date +'%y%m%d-%H%M')" >> $GITHUB_ENV

      - name: Select Xcode 16.4
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: List schemes (debug safety)
        working-directory: external-voidlink
        run: xcodebuild -list -project VoidLink.xcodeproj

      - name: Patch iOS 18 APIs (hidesSharedBackground)
        working-directory: external-voidlink
        run: |
          # Fix hidesSharedBackground - iOS 18+ API not available in Xcode 16.4
          # Replace with #available check to make it build on older iOS
          find . -name "*.swift" -exec sed -i '' \
            -e 's/hidesSharedBackground/false/g' \
            -e 's/\.hidesSharedBackground = true/.barStyle = .plain/g' \
            {} \;

      - name: Archive app
        working-directory: external-voidlink
        run: |
          xcodebuild \
            -project VoidLink.xcodeproj \
            -scheme VoidLink \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/VoidLink.xcarchive \
            -derivedDataPath $PWD/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Create IPA
        working-directory: external-voidlink
        run: |
          APP_PATH=$(find build/VoidLink.xcarchive -name "*.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::App not found in archive"
            exit 1
          fi
          mkdir -p build/IPA/Payload
          cp -r "$APP_PATH" build/IPA/Payload/VoidLink.app
          cd build/IPA
          zip -r ../VoidLink.ipa Payload
          cd ../..

      - name: Verify IPA
        run: |
          if [ ! -f external-voidlink/build/VoidLink.ipa ]; then
            echo "::error::VoidLink.ipa not found!"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidLink-${{ env.TAG_NAME }}
          path: external-voidlink/build/VoidLink.ipa
          retention-days: 7